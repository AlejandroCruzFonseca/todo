name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Run SonarQube Scan
        if: ${{ env.SONAR_HOST_URL && env.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995

      - name: Skip SonarQube scan (missing secrets)
        if: ${{ !env.SONAR_HOST_URL || !env.SONAR_TOKEN }}
        run: echo "SONAR_HOST_URL or SONAR_TOKEN is not set — skipping SonarQube Scan"

